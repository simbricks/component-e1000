# Toolchain for the compiled e1000 behavioral-model binary. This lives inside
# the recipe folder (not the shared conda-recipes/conda_build_config.yaml)
# because only this binary recipe needs a C/C++ compiler; the noarch python
# recipes don't. conda-build loads a recipe-local conda_build_config.yaml
# automatically, merging it with the shared one passed via `-m`.

c_compiler:
  - gcc
c_compiler_version:
  - "13"
cxx_compiler:
  - gxx
cxx_compiler_version:
  - "13"
target_platform:
  - linux-64
c_stdlib:
  - sysroot
c_stdlib_version:
  - "2.17"
