package:
  name: simbricks-e1000-sim-bm-bin
  version: {{ simbricks_version }}

source:
  path: ../../

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make

  host:
    - simbricks-lib >=0.4.2
    - boost-cpp

  run:
    - boost-cpp
    # Co-built python packages from this repo; pinned to the same version.
    - simbricks-e1000-sim-bm-py =={{ simbricks_version }}
    - simbricks-e1000-sys-py =={{ simbricks_version }}

about:
  home: {{ homepage }}
  license: MIT
  license_family: MIT
  license_file: ../../LICENSE
  summary: SimBricks behavioral model of the Intel e1000 NIC.
  dev_url: {{ github_org }}
